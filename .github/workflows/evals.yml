name: Nightly Evals

# Run the LLM-judge golden-set eval against the staging deployment every
# weekday at 14:00 UTC (early morning US Pacific). Also manually triggerable
# via the Actions UI for ad-hoc runs.
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

jobs:
  run-evals:
    name: Run golden-set evals
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evals
        env:
          # The judge LLM call inside run_evals.py needs a Bifrost key — the
          # staging key is fine for the judge model.
          TEKION_LLM_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          python scripts/run_evals.py \
            --url "${{ secrets.STAGING_URL }}" \
            --api-key "${{ secrets.STAGING_API_KEY }}" \
            --label nightly

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/*.json
          retention-days: 30

      - name: Compute eval status
        id: eval_status
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          results_dir = pathlib.Path("evals/results")
          files = sorted(results_dir.glob("*.json"))
          if not files:
              print("No eval results JSON found.")
              # Surface as failure so Slack message is unambiguous.
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("overall_score=0\n")
                  fh.write("n_queries=0\n")
                  fh.write("status=fail\n")
              sys.exit(1)

          latest = files[-1]
          data = json.loads(latest.read_text())
          summary = data.get("summary", {})
          overall = float(summary.get("overall_score") or 0.0)
          n = int(summary.get("n_queries") or 0)
          status = "pass" if overall >= 6.0 else "fail"

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"overall_score={overall}\n")
              fh.write(f"n_queries={n}\n")
              fh.write(f"status={status}\n")

          # Fail the job if score is below threshold so the Action shows red.
          if status == "fail":
              print(f"FAIL: overall={overall} < 6.0")
              sys.exit(1)
          print(f"OK: overall={overall} over {n} queries")
          PY

      - name: Post summary to Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Nightly evals: ${{ steps.eval_status.outputs.status }} (overall ${{ steps.eval_status.outputs.overall_score }} over ${{ steps.eval_status.outputs.n_queries }} queries). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

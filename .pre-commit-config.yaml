repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict

  # Ruff handles both lint and format. We intentionally drop a separate
  # `black` hook here to keep the toolchain minimal — ruff-format is
  # black-compatible and ~10x faster.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: env-example-in-sync
        name: .env.example matches Settings schema
        entry: python scripts/generate_env_example.py --check
        language: system
        pass_filenames: false
        files: ^(app/core/config\.py|\.env\.example)$

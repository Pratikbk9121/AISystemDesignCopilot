[project]
name = "aisystemdesigncopilot"
version = "0.1.0"
description = "Interactive System Design Interviewer & Assistant - AI-powered backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langgraph>=0.2.0",
    "faiss-cpu>=1.9.0",
    "qdrant-client>=1.11.0",
    "sentence-transformers>=3.3.0",
    "redis>=5.2.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "tiktoken>=0.8.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
# Dev extras supersede the deleted requirements-dev.txt. Install with
# `pip install -e ".[dev]"`.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.7.0",
    "flake8>=7.0.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "pre-commit>=3.7.0",
    "ipython>=8.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
# Strict mode is intentionally OFF for now — the codebase has un-typed
# third-party surface (langchain, qdrant-client) that makes `strict = true`
# noisy. Ratchet up over time: re-enable `strict`, then add per-module
# overrides once the worst offenders are wrapped.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
# Auto-mode lets async test functions run without an explicit decorator. We
# still keep explicit @pytest.mark.asyncio decorators for clarity, but this
# keeps things robust against future omissions.
asyncio_mode = "auto"
# Surface coroutine-never-awaited bugs as test failures. Slice 7 introduced
# async cache/state manager interfaces; an unawaited call here is a silent
# correctness bug, so we treat the RuntimeWarning as an error.
filterwarnings = [
  "error::RuntimeWarning",
]
markers = [
  "integration: tests that require external services (Redis, Qdrant)",
  "slow: tests that are slow",
]
